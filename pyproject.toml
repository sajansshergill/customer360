[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer360"
version = "1.0.0"
description = "Consumer360 Customer Data Platform"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "duckdb==1.1.3",
  "pyyaml==6.0.2",
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "streamlit==1.41.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
