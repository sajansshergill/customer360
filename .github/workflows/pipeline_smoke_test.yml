name: Pipeline smoke test

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Run pipeline
        run: bash scripts/run_pipeline.sh --profiles 200
      - name: Data quality
        run: python data_quality/run_checks.py
